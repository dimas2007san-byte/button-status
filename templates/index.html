<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статус кнопки</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        
        .container {
            text-align: center;
            padding: 40px;
        }
        
        h1 { margin-bottom: 10px; font-size: 2rem; }
        
        .subtitle { color: #8892b0; margin-bottom: 40px; }
        
        .status-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .indicator {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        
        .indicator::after {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            opacity: 0.3;
            transition: all 0.4s;
        }
        
        .indicator.on {
            background: #00d26a;
            box-shadow: 0 0 40px #00d26a, 0 0 80px rgba(0,210,106,0.3);
        }
        .indicator.on::after { border: 2px solid #00d26a; }
        
        .indicator.off {
            background: #ff4757;
            box-shadow: 0 0 40px #ff4757, 0 0 80px rgba(255,71,87,0.3);
        }
        .indicator.off::after { border: 2px solid #ff4757; }
        
        .status-text {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        
        .status-text.on { color: #00d26a; }
        .status-text.off { color: #ff4757; }
        
        .toggle-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 16px 48px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        .toggle-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102,126,234,0.4);
        }
        
        .toggle-btn:active { transform: translateY(0); }
        
        .online-users {
            margin-top: 20px;
            color: #8892b0;
            font-size: 0.9rem;
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔘 Управление кнопкой</h1>
        <p class="subtitle">Real-time статус — виден всем пользователям</p>
        
        <div class="status-card">
            <div id="indicator" class="indicator off">
                <span id="icon">⚡</span>
            </div>
            
            <div id="statusText" class="status-text off">ВЫКЛЮЧЕНА</div>
            
            <button id="toggleBtn" class="toggle-btn">
                Переключить
            </button>
            
            <p class="online-users">
                🟢 Подключено: <span id="userCount">1</span>
            </p>
        </div>
    </div>

    <script>
        const socket = io();
        const indicator = document.getElementById('indicator');
        const statusText = document.getElementById('statusText');
        const icon = document.getElementById('icon');
        const toggleBtn = document.getElementById('toggleBtn');

        // Получаем обновление статуса
        socket.on('status_update', (data) => {
            updateUI(data.status);
        });

        // Обработчик кнопки
        toggleBtn.addEventListener('click', () => {
            socket.emit('toggle_button');
            // Визуальная обратная связь
            toggleBtn.style.transform = 'scale(0.95)';
            setTimeout(() => toggleBtn.style.transform = '', 150);
        });

        function updateUI(isOn) {
            if (isOn) {
                indicator.className = 'indicator on';
                statusText.className = 'status-text on';
                statusText.textContent = 'ВКЛЮЧЕНА';
                icon.textContent = '🔥';
            } else {
                indicator.className = 'indicator off';
                statusText.className = 'status-text off';
                statusText.textContent = 'ВЫКЛЮЧЕНА';
                icon.textContent = '⚡';
            }
        }
    </script>
</body>
</html>
